name: Build, Test & Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/symomkuu

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend requirements
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py test

  frontend:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  docker-backend:
    name: Build & push backend image
    needs: [backend, detect-changes]
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: short_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: symomkuu
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/dallian-backend:latest
            ${{ env.IMAGE_PREFIX }}/dallian-backend:${{ steps.short_sha.outputs.short_sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/dallian-backend:buildcache
          cache-to: type=registry,mode=max,ref=${{ env.IMAGE_PREFIX }}/dallian-backend:buildcache

  docker-frontend:
    name: Build & push frontend image
    needs: [frontend, detect-changes]
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: short_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: symomkuu
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://dallian.online' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://dallian.online' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '420729352352-l3vvp4uqn5p82fhibdphagoe2bma9gj3.apps.googleusercontent.com' }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/dallian-frontend:latest
            ${{ env.IMAGE_PREFIX }}/dallian-frontend:${{ steps.short_sha.outputs.short_sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/dallian-frontend:buildcache
          cache-to: type=registry,mode=max,ref=${{ env.IMAGE_PREFIX }}/dallian-frontend:buildcache

  deploy:
    name: Deploy to VPS
    needs:
      - docker-backend
      - docker-frontend
      - detect-changes
    if: |
      always() &&
      (
        needs.detect-changes.outputs.backend != 'true' ||
        needs.docker-backend.result == 'success'
      ) &&
      (
        needs.detect-changes.outputs.frontend != 'true' ||
        needs.docker-frontend.result == 'success'
      ) &&
      (
        needs.detect-changes.outputs.backend == 'true' ||
        needs.detect-changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Set short SHA
        id: short_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.short_sha.outputs.short_sha }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          IMAGE_PREFIX: ghcr.io/symomkuu
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,BACKEND_CHANGED,FRONTEND_CHANGED,IMAGE_PREFIX,GHCR_PULL_TOKEN
          command_timeout: 10m
          script: |
            set -e
            cd /var/www/dallian

            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u symomkuu --password-stdin

            SERVICES_TO_UPDATE=""

            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo "Updating backend to $IMAGE_TAG..."
              docker pull $IMAGE_PREFIX/dallian-backend:$IMAGE_TAG
              docker tag $IMAGE_PREFIX/dallian-backend:$IMAGE_TAG $IMAGE_PREFIX/dallian-backend:latest

              echo "Running migrations..."
              docker compose run --rm -T --no-deps backend python manage.py migrate --noinput > /tmp/migrate.log 2>&1 || {
                cat /tmp/migrate.log
                echo "❌ Migration failed — aborting deploy"
                exit 1
              }
              cat /tmp/migrate.log

              SERVICES_TO_UPDATE="$SERVICES_TO_UPDATE backend"
            fi

            if [ "$FRONTEND_CHANGED" = "true" ]; then
              echo "Updating frontend to $IMAGE_TAG..."
              docker pull $IMAGE_PREFIX/dallian-frontend:$IMAGE_TAG
              docker tag $IMAGE_PREFIX/dallian-frontend:$IMAGE_TAG $IMAGE_PREFIX/dallian-frontend:latest
              SERVICES_TO_UPDATE="$SERVICES_TO_UPDATE frontend"
            fi

            if [ -n "$SERVICES_TO_UPDATE" ]; then
              echo "Recreating services:$SERVICES_TO_UPDATE"
              docker compose up -d --force-recreate --no-deps --no-build $SERVICES_TO_UPDATE > /tmp/deploy.log 2>&1 || {
                cat /tmp/deploy.log
                echo "❌ Deploy failed — printing logs"
                docker compose logs --tail=50
                exit 1
              }

              echo "Waiting for containers to stabilize..."
              sleep 8

              echo "Container status:"
              docker compose ps $SERVICES_TO_UPDATE

              echo "✓ Deploy complete"
            else
              echo "No services to update"
            fi
